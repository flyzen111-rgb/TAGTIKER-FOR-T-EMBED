; TagTinker pour LilyGo T-Embed CC1101 (ESP32-S3, 16 Mo flash, 8 Mo PSRAM OPI)
;
; La version de plateforme est FIGEE volontairement : elle embarque Arduino-ESP32
; 2.0.x (ESP-IDF 4.4), dont le pilote RMT "legacy" est celui utilise par ir_tx.cpp.
; Ne passez pas a Arduino-ESP32 3.x sans reecrire ir_tx.cpp.

[env:t-embed-cc1101]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mathertel/RotaryEncoder@^1.5.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI : ecran ST7789 170x320 du T-Embed (brochage officiel LilyGo) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    -DSUPPORT_TRANSACTIONS=1
